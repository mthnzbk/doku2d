[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doku2d"
version = "0.1.0"
description = "Python için kod odaklı 2D oyun framework'ü"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Metehan Özbek"}]
dependencies = ["sfml>=3.0.2.0", "pymunk>=7.0"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
build = ["nuitka>=2.6"]

[project.scripts]
doku2d = "doku2d.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["doku2d", "doku2d.*"]

[tool.setuptools.package-data]
doku2d = ["assets/LICENSE", "assets/fonts/*", "cli/template/*", "cli/template/.gitignore", "cli/template/assets/*"]
