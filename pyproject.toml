[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doku2d"
version = "1.0.0rc3"
description = "Python için kod odaklı 2D oyun framework'ü"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Metehan Özbek"}]
dependencies = ["sfml>=3.0.2.0,<3.1", "pymunk>=7.0,<8"]
classifiers = [
    "Intended Audience :: Developers",
    "Development Status :: 4 - Beta",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
build = ["nuitka>=2.6"]

[project.scripts]
doku2d = "doku2d.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["doku2d", "doku2d.*"]

[tool.setuptools.package-data]
doku2d = ["assets/LICENSE", "assets/fonts/*", "assets/icon.png", "assets/icon.ico", "cli/template/*", "cli/template/.gitignore", "cli/template/assets/*"]
"doku2d.android" = ["template/*", "template/scripts/*", "template/native/*", "template/app/*", "template/app/src/main/*.xml", "template/app/src/main/java/org/doku2d/pysfmldemo/*.java", "template/project/*.xml", "template/project/res/values/*.xml"]
